<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{background:linear-gradient(135deg,var(--navy) 0%,#1a2d5a 100%);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.5)}

.header-title{flex:1;min-width:0}
.header-title h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);line-height:1}
.header-title span{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;display:block;margin-top:3px}
@media(max-width:480px){
  .header-title h1{font-size:18px;letter-spacing:1.5px}
  .header-title span{font-size:9px}
}
.cart-btn{position:relative;background:var(--gold);color:var(--navy);border:none;border-radius:12px;padding:10px 16px;font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s}
.cart-btn:active{transform:scale(0.96)}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:white;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* TABS */
.tabs{display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--border);max-width:900px;margin:0 auto;padding:0 14px}
.tab{flex:0 0 auto;padding:12px 18px;font-size:13px;font-weight:600;color:var(--grey3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.2s;letter-spacing:0.5px}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.search-team-wrap{flex:1;position:relative;display:flex;align-items:center;padding:8px 0}
#teamSelect{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 36px 9px 14px;color:var(--white);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;cursor:pointer;appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23c8a84b' d='M6 8L0 0h12z'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
#teamSelect:focus{border-color:var(--gold)}
#teamSelect option{background:var(--card);color:var(--white);padding:8px}
#teamSelect optgroup{background:var(--navy);color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;font-weight:normal}
@media(max-width:480px){
  .tabs{padding:0 10px;gap:6px}
  .tab{padding:11px 12px;font-size:12px}
  #teamSelect{font-size:12px;padding:8px 32px 8px 12px}
}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:16px}

/* BANNER SCOREVISION */
.sv-banner{display:block;max-width:900px;margin:14px auto 0;padding:0 16px}
.sv-banner a{display:block;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s;line-height:0}
.sv-banner a:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.sv-banner a:active{transform:scale(0.99)}
.sv-banner img{width:100%;height:auto;display:block}
.sv-banner .sv-tag{position:absolute;top:10px;left:10px;background:rgba(10,27,61,0.85);color:var(--gold2);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--border);backdrop-filter:blur(4px)}
.sv-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 14px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border:1px solid var(--border);border-radius:12px;text-decoration:none;transition:border-color 0.2s,transform 0.15s}
.sv-link:hover{border-color:var(--gold)}
.sv-link:active{transform:scale(0.99)}
.sv-link-text{font-size:13px;color:rgba(255,255,255,0.85)}
.sv-link-text strong{color:var(--gold2)}
.sv-link-cta{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:700;padding:7px 14px;border-radius:10px;white-space:nowrap}
.sv-arrow{transition:transform 0.2s}
.sv-link:hover .sv-arrow{transform:translateX(3px)}
@media(max-width:480px){
  .sv-link{padding:9px 12px}
  .sv-link-text{font-size:11.5px}
  .sv-link-cta{font-size:12px;padding:6px 12px}
}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--grey3)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* PRECIOS */
.prices-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.price-badge{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:5px}
.price-badge strong{color:var(--gold);font-size:12px}

/* LEYENDA */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.6)}
.legend-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}

/* GRUPO */

.group-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold)}
.group-line{flex:1;height:1px;background:var(--border)}

.team-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;transition:border-color 0.2s}
.team-card:hover{border-color:rgba(200,168,75,0.4)}
.team-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,rgba(10,27,61,0.8) 0%,rgba(30,37,53,0.5) 100%);border-bottom:1px solid var(--border)}
.team-code{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--gold)}
.team-name{font-size:13px;font-weight:500;color:rgba(255,255,255,0.7)}
.team-count{margin-left:auto;background:rgba(200,168,75,0.15);color:var(--gold);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid rgba(200,168,75,0.3)}

/* GRID */
.laminas-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:10px}

@media(max-width:380px){.laminas-grid{grid-template-columns:repeat(6,1fr);gap:3px}}
.lamina-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:default;transition:all 0.15s;position:relative;min-height:36px;user-select:none;-webkit-user-select:none;overflow:hidden;padding:2px}
.lamina-cell.empty{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.06)}
.lamina-cell.has-rep{background:linear-gradient(135deg,var(--green) 0%,var(--green2) 100%);color:white;border:1px solid rgba(255,255,255,0.15);box-shadow:0 2px 8px rgba(46,125,50,0.3);cursor:pointer}
.lamina-cell.has-rep:active{transform:scale(0.92)}
.lamina-cell.in-cart{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:var(--navy);border:1px solid rgba(255,255,255,0.3);box-shadow:0 2px 12px rgba(200,168,75,0.4)}
.lam-num{font-size:11px;font-weight:700;line-height:1;text-align:center}
.lam-qty{font-size:9px;font-weight:600;opacity:0.85;line-height:1;margin-top:2px}
@media(max-width:480px){
  .lam-num{font-size:9.5px}
  .lam-qty{font-size:8px}
  .lamina-cell{min-height:32px}
}
.lam-price{font-size:8px;opacity:0.7;line-height:1}

.cart-modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid var(--border)}

.cart-items{overflow-y:auto;flex:1;padding:16px 20px}
.cart-empty{text-align:center;color:var(--grey3);padding:40px 0;font-size:14px}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:10px}

.cart-item-label{font-size:14px;font-weight:600}

.cart-footer{padding:16px 20px;border-top:1px solid var(--border);background:var(--card);border-radius:0 0 24px 24px}

.cart-total-value{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);letter-spacing:1px}
.cart-total-count{font-size:12px;color:rgba(255,255,255,0.4);text-align:right}
.buyer-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--white);font-family:'Outfit',sans-serif;font-size:14px;outline:none;margin-bottom:14px}

  {code:"IRN",name:"Irán",group:"G"},{code:"NZL",name:"Nueva Zelanda",group:"G"},
  {code:"ESP",name:"España",group:"H"},{code:"CPV",name:"Cabo Verde",group:"H"},
  {code:"KSA",name:"Arabia Saudita",group:"H"},{code:"URU",name:"Uruguay",group:"H"},
  {code:"FRA",name:"Francia",group:"I"},{code:"SEN",name:"Senegal",group:"I"},
  {code:"IRQ",name:"Irak",group:"I"},{code:"NOR",name:"Noruega",group:"I"},
  {code:"ARG",name:"Argentina",group:"J"},{code:"ALG",name:"Argelia",group:"J"},
  {code:"AUT",name:"Austria",group:"J"},{code:"JOR",name:"Jordania",group:"J"},
  {code:"POR",name:"Portugal",group:"K"},{code:"COD",name:"Rep. D. Congo",group:"K"},
  {code:"UZB",name:"Uzbekistán",group:"K"},{code:"COL",name:"Colombia",group:"K"},
  {code:"ENG",name:"Inglaterra",group:"L"},{code:"CRO",name:"Croacia",group:"L"},
  {code:"GHA",name:"Ghana",group:"L"},{code:"PAN",name:"Panamá",group:"L"},
];

// Precios especiales por lámina concreta (code → {num: precio})
const PRICE_OVERRIDES = {
  COL: {1:6000, 12:5000, 13:20000, 14:20000, 20:20000},
  CRO: {9:5000},
  ARG: {18:5000},
  NOR: {15:10000},
  FRA: {15:7000, 20:20000},
  FWC: {0:30000, 4:30000, 9:10000, 10:10000, 11:10000, 12:10000, 13:10000, 14:10000, 16:10000},
  ESP: {1:7000},
};
// Precio por defecto para TODAS las láminas de un equipo (salvo overrides arriba)
const TEAM_DEFAULT_PRICE = {
  COL: 3000,
};
function getPrice(code,num){
  const ov = PRICE_OVERRIDES[code];
  if(ov && ov[num]!=null) return ov[num];
  if(TEAM_DEFAULT_PRICE[code]!=null) return TEAM_DEFAULT_PRICE[code];
  if(code==='CC') return 9000;
  if(code==='FWC') return 6000;
  if(num===1) return 6000;
  if(num===13) return 4000;
  return 1000;
}
function fmtPrice(p){return '$'+p.toLocaleString('es-CO')}
function getRange(code){
  if(code==='CC') return Array.from({length:14},(_,i)=>i+1);
  if(code==='FWC') return Array.from({length:20},(_,i)=>i);
  return Array.from({length:20},(_,i)=>i+1);
}
function getLbl(code,num){
  if(code==='CC') return `CC${num}`;
  if(code==='FWC') return `FWC-${String(num).padStart(2,'0')}`;
  return String(num);
}
// Versión corta para la celda (sin prefijo - ya se ve en el título de la sección)
function getLblShort(code,num){
  if(code==='CC') return String(num);
  if(code==='FWC') return String(num).padStart(2,'0');
  return String(num);
}

// ── ESTADO ───────────────────────────────────────────────────
let inventory = {}; // {CODE_NUM: cantidad}
let cart = [];
let teamFilter = '';

function invKey(code,num){return `${code}_${num}`}

async function loadInventory(){
  const {data,error} = await sb.from('repetidas_inventario').select('*');
  if(error){console.error(error);return;}
  inventory = {};
  data.forEach(r=>{ inventory[invKey(r.code,r.num)] = r.cantidad; });
  // Cargar carrito de sessionStorage
  try{ const sc=sessionStorage.getItem('laminas_cart'); if(sc) cart=JSON.parse(sc); }catch(e){cart=[];}
  renderContent();
  updateCartBadge();
}

function saveCart(){sessionStorage.setItem('laminas_cart',JSON.stringify(cart));}

function getCartItem(code,num){return cart.find(i=>i.code===code&&i.num===num);}

function addToCart(code,num){
  const available = inventory[invKey(code,num)] || 0;
  const inCart = getCartItem(code,num);
  const cartQty = inCart ? inCart.qty : 0;
  if(cartQty>=available){showToast(`Solo hay ×${available} disponibles`);return;}
  const team = ALBUM.find(t=>t.code===code);
  if(inCart){ inCart.qty++; }
  else{ cart.push({code,num,label:getLbl(code,num),price:getPrice(code,num),qty:1,teamName:team.name}); }
  saveCart(); updateCartBadge(); renderContent();
  showToast(`${getLbl(code,num)} (${team.name}) agregada`);
}

function removeFromCart(code,num){
  const idx=cart.findIndex(i=>i.code===code&&i.num===num);
  if(idx===-1)return;
  if(cart[idx].qty>1) cart[idx].qty--;
  else cart.splice(idx,1);
  saveCart(); updateCartBadge(); renderContent(); renderCartItems();
}

function clearCart(){cart=[];saveCart();updateCartBadge();renderContent();renderCartItems();}

function updateCartBadge(){
  const total=cart.reduce((s,i)=>s+i.qty,0);
  const b=document.getElementById('cartBadge');
  if(total>0){b.style.display='flex';b.textContent=total;}else b.style.display='none';
}

function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}

// ── RENDER ───────────────────────────────────────────────────
function renderContent(){
  const groups = ['—','A','B','C','D','E','F','G','H','I','J','K','L'];
  let html='';
  let totalShown = 0;
  groups.forEach(grp=>{
    let teams = ALBUM.filter(t=>t.group===grp);
    if(teamFilter){
      teams = teams.filter(t => t.code === teamFilter);
    }
    if(!teams.length)return;
    totalShown += teams.length;
    const grpLabel=grp==='—'?'Especiales':`Grupo ${grp}`;
    html+=`<div class="group-header"><span class="group-label">${grpLabel}</span><div class="group-line"></div></div>`;
    teams.forEach(team=>{
      const range=getRange(team.code);
      const totalRep=range.reduce((s,n)=>s+(inventory[invKey(team.code,n)]||0),0);
      html+=`<div class="team-card">
        <div class="team-header">
          <span class="team-code">${team.code}</span>
          <span class="team-name">${team.name}</span>
          ${totalRep>0?`<span class="team-count">${totalRep} repetida${totalRep>1?'s':''}</span>`:''}
        </div>
        <div class="laminas-grid">`;
      range.forEach(num=>{
        const qty=inventory[invKey(team.code,num)]||0;
        const lblShort=getLblShort(team.code,num);
        const lblFull=getLbl(team.code,num);
        const price=getPrice(team.code,num);
        const inCart=getCartItem(team.code,num);
        const cartQty=inCart?inCart.qty:0;
        if(qty===0){
          html+=`<div class="lamina-cell empty" title="${lblFull}"><span class="lam-num">${lblShort}</span></div>`;
        } else {
          const full=cartQty>=qty;
          html+=`<div class="lamina-cell ${full?'in-cart':'has-rep'}" title="${lblFull}" onclick="${full?`showToast('Ya agregaste todas las copias')`:`addToCart('${team.code}',${num})`}">
            <span class="lam-num">${lblShort}</span>
            ${qty>1?`<span class="lam-qty">×${qty}</span>`:''}
            ${cartQty>0?`<span class="lam-qty" style="color:${full?'var(--navy)':'var(--gold2)'}">🛒${cartQty}</span>`:''}
            <span class="lam-price">${fmtPrice(price)}</span>
          </div>`;
        }
      });
      html+=`</div></div>`;
    });
  });
  if(totalShown === 0 && q){
    html = `<div style="text-align:center;color:var(--grey3);padding:60px 20px;font-size:14px">
      <div style="font-size:40px;margin-bottom:12px">🔍</div>
      No se encontraron equipos para "<strong style="color:var(--gold2)">${esc(teamFilter)}</strong>"
    </div>`;
  }
  document.getElementById('content').innerHTML=html;
}

// ── CARRITO MODAL ────────────────────────────────────────────
function openCart(){renderCartItems();document.getElementById('cartOverlay').classList.add('open');document.body.style.overflow='hidden';}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');document.body.style.overflow='';}
function closeCartOutside(e){if(e.target===document.getElementById('cartOverlay'))closeCart();}

function renderCartItems(){
  const total=cartTotal();
  const count=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartTotal').textContent=fmtPrice(total);
  document.getElementById('cartCount').textContent=`${count} lámina${count!==1?'s':''}`;
  const container=document.getElementById('cartItems');
  if(!cart.length){container.innerHTML='<div class="cart-empty">🛒<br><br>Tu carrito está vacío<br><small>Toca las láminas verdes para agregar</small></div>';return;}
  container.innerHTML=cart.map(item=>`
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-dot"></div>
        <div>
          <div class="cart-item-label">${esc(item.label)} — ${esc(item.teamName)}</div>
          <div class="cart-item-sub">${esc(fmtPrice(item.price))} c/u${item.qty>1?` × ${Number(item.qty)|0}`:''}</div>
        </div>
      </div>
      <div class="cart-item-price">${esc(fmtPrice(item.price*item.qty))}</div>
      <button class="cart-item-remove" onclick="removeFromCart('${esc(item.code)}',${Number(item.num)|0});renderCartItems()">−</button>
    </div>`).join('');
}

function sendWhatsApp(){
  if(!cart.length){showToast('Tu carrito está vacío');return;}
  const buyerRaw = document.getElementById('buyerName').value.trim();
  const buyer = buyerRaw.slice(0, 100); // límite de seguridad
  const total = cartTotal();
  const count = cart.reduce((s,i)=>s+i.qty,0);

  // Validaciones cliente
  if(count < 1 || count > 200){ showToast('Cantidad de láminas no válida'); return; }
  if(total < 1 || total > 5000000){ showToast('Total fuera de rango'); return; }
  if(cart.length > 200){ showToast('Carrito demasiado grande'); return; }

  // Construir mensaje WhatsApp (sin emojis para máxima compatibilidad)
  let msg = '*Álbum Panini FIFA World Cup 2026*\n';
  msg += '--------------------------------\n';
  if(buyer) msg += `*${buyer}*\n--------------------------------\n`;
  msg += '*Láminas seleccionadas:*\n\n';
  const byTeam = {};
  cart.forEach(i => { if(!byTeam[i.teamName]) byTeam[i.teamName] = []; byTeam[i.teamName].push(i); });
  Object.entries(byTeam).forEach(([team, items]) => {
    msg += `*${team}:*\n`;
    items.forEach(i => {
      if(i.qty>1){
        msg += `  • ${i.label} x${i.qty} — ${fmtPrice(i.price)} c/u (${fmtPrice(i.price*i.qty)})\n`;
      } else {
        msg += `  • ${i.label} — ${fmtPrice(i.price)}\n`;
      }
    });
  });
  msg += `\n--------------------------------\n`;
  msg += `*Total láminas:* ${count}\n`;
  msg += `*Total a pagar:* ${fmtPrice(total)}\n`;
  msg += `--------------------------------\n`;
  msg += `_laminas.scorevision.space_`;

  // Registrar pedido en BD SIN bloquear (fire-and-forget para no perder el user gesture)
  try {
    sb.from('repetidas_pedidos').insert({
      comprador: buyer || null,
      items: cart,
      total_laminas: count,
      total_precio: total
    }).then(r => { if(r.error) console.warn('Pedido no registrado:', r.error); });
  } catch(e){ console.warn(e); }

  // Detectar móvil/escritorio para elegir la mejor URL
  const isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const waUrl = isMobile
    ? `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`
    : `https://web.whatsapp.com/send?phone=${WA_NUMBER}&text=${encodeURIComponent(msg)}`;

  // Abrir con <a> programático (más confiable que window.open contra popup blockers)
  const a = document.createElement('a');
  a.href = waUrl;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── FILTRO DE EQUIPOS ────────────────────────────────────────
function resetFilter(){
  teamFilter = '';
  const sel = document.getElementById('teamSelect');
  if(sel) sel.value = '';
  renderContent();
}

function onTeamSelectChange(e){
  teamFilter = e.target.value;
  renderContent();
}

function populateTeamSelect(){
  const sel = document.getElementById('teamSelect');
  // Mantener la opción default
  sel.innerHTML = '<option value="">— Selecciona un equipo —</option>';

  const groupNames = {
    '—':'Especiales', 'A':'Grupo A','B':'Grupo B','C':'Grupo C','D':'Grupo D',
    'E':'Grupo E','F':'Grupo F','G':'Grupo G','H':'Grupo H',
    'I':'Grupo I','J':'Grupo J','K':'Grupo K','L':'Grupo L'
  };
  const order = ['—','A','B','C','D','E','F','G','H','I','J','K','L'];

  order.forEach(grp=>{
    const teams = ALBUM.filter(t => t.group === grp);
    if(!teams.length) return;
    const og = document.createElement('optgroup');
    og.label = groupNames[grp] || grp;
    teams.forEach(t=>{
      const opt = document.createElement('option');
      opt.value = t.code;
      opt.textContent = `${t.code} — ${t.name}`;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}

// ── TOAST ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── INIT ─────────────────────────────────────────────────────
populateTeamSelect();
document.getElementById('teamSelect').addEventListener('change', onTeamSelectChange);
loadInventory();
</script>
